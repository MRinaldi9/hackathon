<div class="game-root">

  <!-- INTRO -->
  @if (mostraIntro) {
    <div class="intro-screen">
      <div class="cabinet-screen" role="img" aria-label="Schermata arcade FINFLOW - Simulazione di vita">
        <div class="cabinet-title" aria-hidden="true">FINFLOW</div>
        <div class="cabinet-subtitle" aria-hidden="true">SIMULAZIONE DI VITA</div>
        <div class="insert-coin" aria-hidden="true">— TOCCA PER INIZIARE —</div>
      </div>
      <button class="start-btn" (click)="inizia()" type="button">INSERISCI GETTONE</button>
    </div>
  }

  <!-- LOADING -->
  @if (!mostraIntro && caricamento) {
    <div class="loader" role="status" aria-live="polite" aria-label="Caricamento in corso">
      <div class="loader-label" aria-hidden="true">CARICAMENTO…</div>
      <div class="loader-track" aria-hidden="true">
        <div class="loader-bar"></div>
      </div>
    </div>
  }

  <!-- GIOCO -->
  @if (!mostraIntro && !caricamento && item) {
    <div class="game-screen">

      <!-- energy bar (senza numeri) -->
      <div
        class="energy-bar"
        role="progressbar"
        [attr.aria-valuenow]="progresso"
        aria-valuemin="0"
        aria-valuemax="8"
        [attr.aria-label]="'Progresso: ' + progresso + ' di 8 domande'">
        <div class="energy-fill" [style.width.%]="(progresso / 8) * 100"></div>
      </div>

      <!-- trivio percorribile (domanda + destinazioni A/B/C + avatar) -->
      <app-trivio
        [item]="item"
        accent="purp"
        [esito]="esitoFlash"
        (scelta)="scegli($event)">
      </app-trivio>

      <!-- flash overlay (annuncio screen-reader) -->
      @if (esitoFlash) {
        <div
          class="flash-overlay"
          [class]="'flash-overlay flash-' + esitoFlash"
          aria-hidden="true">
        </div>
        <div role="alert" class="sr-only">
          {{ esitoFlash === 'correct' ? 'Risposta corretta!' : 'Risposta errata.' }}
        </div>
      }

    </div>
  }

</div>
