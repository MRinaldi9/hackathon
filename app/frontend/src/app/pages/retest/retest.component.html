<!-- Re-test: stesse gesture della diagnosi, ma item mai visti prima -->
<div class="arcade-root retest-root">

  <!-- LOADING -->
  @if (caricamento) {
    <div class="arcade-loader" role="status" aria-live="polite" aria-label="Preparazione verifica finale">
      <div class="arcade-loader-label" aria-hidden="true">VERIFICA FINALE…</div>
      <div class="arcade-loader-track" aria-hidden="true">
        <div class="arcade-loader-bar"></div>
      </div>
    </div>
  }

  <!-- GIOCO -->
  @if (!caricamento && item) {
    <div class="game-screen">

      <!-- trivio percorribile con accento ambra e badge verifica finale -->
      <app-trivio
        [item]="item"
        accent="amber"
        etichetta="VERIFICA FINALE"
        [esito]="feedbackFlash"
        (scelta)="scegli($event)">
      </app-trivio>

      <!-- flash feedback overlay + annuncio screen-reader -->
      @if (feedback) {
        <div class="flash-overlay" [class.flash-correct]="feedback === 'esatta'" [class.flash-wrong]="feedback === 'errata'" aria-hidden="true"></div>
        <div role="alert" class="sr-only">
          {{ feedback === 'esatta' ? 'Risposta corretta!' : 'Risposta errata.' }}
        </div>
      }

    </div>
  }

</div>
